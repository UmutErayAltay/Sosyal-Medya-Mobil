# Project-wide Gradle settings.
#
# KRİTİK (2 katmanlı bulgu):
# 1) Bu sandboxed ortamda Gradle daemon çok yüksek heap ile ("-Xmx1536m" veya
#    üstü) "Could not reserve enough space for object heap" hatası veriyor —
#    bu bir JVM başlangıç REZERVASYON sınırı (root TWA projesinde bulunmuştu).
# 2) AMA bu proje (Compose+Room+Retrofit+OkHttp+Coil+Navigation) TWA'dan çok
#    daha büyük bir dexing girdisine sahip — 512m ile D8 dexing adımı
#    GERÇEKTEN OutOfMemoryError veriyor (deneyerek bulundu, ayrı bir sorun).
#    1024m hem (1)'deki rezervasyon sınırının altında kalıyor hem D8 için
#    yeterli oldu.
# 3) LiveKit (grup sesli/görüntülü arama, native görev) WebRTC/noise native
#    kütüphaneleriyle geliyor — dexing girdisi TEKRAR büyüdü, 1024m ile
#    mergeExtDexDebug D8 OutOfMemoryError verdi (deneyerek bulundu). 1280m
#    hem (1)'deki rezervasyon sınırının (1536m+) ALTINDA kalıyor hem GERÇEK
#    `gradlew assembleDebug` ile BUILD SUCCESSFUL doğrulandı.
org.gradle.jvmargs=-Xmx1280m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

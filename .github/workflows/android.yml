name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testler
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release APK (arm64-v8a, debug anahtarıyla imzalı)
        run: bash ./gradlew --no-daemon :app:assembleRelease -PreleaseAbi=arm64-v8a

      - name: APK özeti
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: sosyal-medya-native-apk
          path: native-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-raporlari
          path: native-app/app/build/reports/
          if-no-files-found: ignore
